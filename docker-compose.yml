# Local development stack for Project "Good Job"
#   postgres  -> persistence tool (ledger, balances, transfers, posts, outbox, ...)
#   redis     -> messaging tool (Redis STREAMS for the event bus) + SSE Pub/Sub backplane + cache
#   minio     -> storage tool (S3-compatible; same adapter path as prod S3, endpoint differs)
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#   docker compose down            (keep data)
#   docker compose down -v         (wipe volumes — fresh start)

services:
  # ---------------------------------------------------------------------------
  # Postgres — the persistence tool's default provider
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: goodjob-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goodjob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goodjob}
      POSTGRES_DB: ${POSTGRES_DB:-goodjob}
      # Speeds up local dev; do NOT use this in production.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -q keeps it quiet; checks the actual DB is accepting connections
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goodjob} -d ${POSTGRES_DB:-goodjob} -q"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [goodjob]

  # ---------------------------------------------------------------------------
  # Redis — messaging (Streams) + SSE Pub/Sub backplane + cache
  #   AOF persistence is ON so Stream entries survive a restart (the event bus
  #   needs durability; Pub/Sub is used only for best-effort SSE fan-out).
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: goodjob-redis
    restart: unless-stopped
    # appendonly yes  -> durable AOF so Streams (XADD/XREADGROUP) persist across restarts
    # appendfsync everysec -> good durability/perf balance for local
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory-policy noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [goodjob]

  # ---------------------------------------------------------------------------
  # MinIO — the storage tool's default provider (S3-compatible object storage)
  #   Console UI at http://localhost:9001  (login with the root creds below)
  #   S3 API at     http://localhost:9000
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: goodjob-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"     # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [goodjob]

  # ---------------------------------------------------------------------------
  # One-shot: create the media bucket and set it up, then exit.
  #   Runs after MinIO is healthy; idempotent (safe to re-run).
  # ---------------------------------------------------------------------------
  minio-setup:
    image: minio/mc:latest
    container_name: goodjob-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-goodjob-media} &&
      mc anonymous set download local/${MINIO_BUCKET:-goodjob-media} &&
      echo 'MinIO bucket ready: ${MINIO_BUCKET:-goodjob-media}' &&
      exit 0
      "
    networks: [goodjob]
    
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: goodjob-pgadmin
    restart: unless-stopped
    profiles: [tools]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [goodjob]
    
volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  goodjob:
    driver: bridge
